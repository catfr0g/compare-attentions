repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run --locked pylint
        language: system
        types: [python]
        files: ^(src|tests)/
        exclude: ^(\.venv|\.uv-cache)/
