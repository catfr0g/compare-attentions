# Reuse the existing UV environment. Never install or rewrite scientific inputs.
# Exact scope and historical local-only exclusions: docs/developer-validation.md.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff (check only)
        entry: uv run --offline --no-sync ruff check
        language: system
        types: [python]
        exclude: ^src/compare_attention/data/(sorting_source|tracking_source)/
      - id: ruff-format
        name: Ruff format (check only)
        entry: uv run --offline --no-sync ruff format --check
        language: system
        types: [python]
        exclude: ^src/compare_attention/data/(sorting_source|tracking_source)/
      - id: pylint
        name: Pylint errors and fatal diagnostics
        entry: uv run --offline --no-sync pylint --disable=all --enable=E,F
        language: system
        types: [python]
        files: ^(src|tests|scripts)/
        exclude: ^src/compare_attention/data/(sorting_source|tracking_source)/
      - id: pytest
        name: Portable CPU repository tests (not CUDA qualification)
        entry: >-
          uv run --offline --no-sync pytest -q -x
          tests/compare_attention tests/integration tests/e2e
          tests/scripts/test_repository_validation.py
          --ignore=tests/compare_attention/test_sorting_candidate.py
          --ignore=tests/compare_attention/cli/test_fp16_lr_pilots.py
          --ignore=tests/compare_attention/cli/test_tracking.py
          --ignore=tests/compare_attention/data/test_selective_count_reference.py
          --ignore=tests/compare_attention/data/test_tracking.py
          --ignore=tests/compare_attention/train/test_phase_handshake.py
        language: system
        pass_filenames: false
        always_run: true
