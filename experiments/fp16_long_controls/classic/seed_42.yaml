data: data/kv_retrieval

schedule:
  train_flops: 100_000_000_000_000_000
  batch_size: 8
  seed: 42
  dtype: float16
  compile: true
  checkpoint_every_steps: 1000
  checkpoint_keep_last: 2
  early_stopping_patience: 20
  early_stopping_min_delta: 0.001
  early_stopping_min_steps: 2000
  amp_max_scale: 128.0

optim:
  learning_rate: 0.0003
  weight_decay: 0.1

model:
  vocab_size: 8192
  block_size: 512
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.0
  bias: true
  attention: classic
