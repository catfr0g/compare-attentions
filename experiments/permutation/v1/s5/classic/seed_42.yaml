{
  "data": "local/datasets/permutation-s5-v1",
  "dataset_task": "permutation",
  "tracker": "clearml",
  "model": {
    "vocab_size": 121,
    "block_size": 512,
    "n_layer": 4,
    "n_head": 4,
    "n_embd": 128,
    "dropout": 0.0,
    "bias": true,
    "attention": "classic"
  },
  "schedule": {
    "train_flops": 100000000000000,
    "axis": "train_flops",
    "batch_size": 32,
    "seed": 42,
    "dtype": "float16",
    "compile": true,
    "amp_max_scale": 128.0,
    "val_every_steps": 1000,
    "log_every_steps": 250,
    "checkpoint_every_steps": 5000,
    "checkpoint_keep_last": 2,
    "early_stopping_patience": 0,
    "early_stopping_min_delta": 0.001,
    "early_stopping_min_steps": 2000
  },
  "optim": {
    "learning_rate": 0.001,
    "weight_decay": 0.1,
    "lr_schedule": "constant",
    "warmup_fraction": 0.05,
    "min_lr_ratio": 0.1
  }
}
