[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "compare-attention"
version = "0.1.0"
description = "Reproducible attention experiments on synthetic tasks"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy>=2.1,<3", "torch>=2.6,<3"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pylint>=3,<5",
    "ruff>=0.11,<1",
]

[project.scripts]
prepare-kv-retrieval = "compare_attention.cli.prepare_kv_retrieval:main"
clean-kv-retrieval = "compare_attention.cli.prepare_kv_retrieval:clean_main"
lint = "compare_attention.cli.lint:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/compare_attention"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
ignore-paths = ["^\\.venv", "^\\.uv-cache"]
py-version = "3.14"

[tool.pylint.format]
max-line-length = 100
max-module-lines = 300

[tool.pylint.design]
max-args = 8
max-attributes = 8
max-positional-arguments = 8

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]
